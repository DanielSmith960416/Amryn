# ═══════════════════════════════════════════════════════════════════════════
# Amryn™ AIGrowthIntelligence® Software — Supabase configuration
#
# Two jobs:
#
#   · `supabase start` reads this to stand up a local stack that matches
#     production, so local development is not a different product.
#
#   · `supabase config push` applies the [auth] settings to the linked remote
#     project, which puts the redirect allow-list under version control instead
#     of in someone's memory of a dashboard click.
#
# ── Before pushing, read this ──────────────────────────────────────────────
# `config push` applies EVERYTHING in this file to the remote project, not
# just what you changed. If you have configured anything in the dashboard that
# is not represented here, pushing will reset it. Check the diff the CLI prints
# before confirming, or set the values in the dashboard instead — the file is
# still useful for local development either way.
#
#   supabase link --project-ref <your-project-ref>
#   supabase config push          # prints a diff and asks before applying
# ═══════════════════════════════════════════════════════════════════════════

# The linked project. This is what `supabase link` writes here, and it is not
# a secret — the same ref is in the public Supabase URL and in the browser
# bundle of any deployed Supabase app.
#   Dashboard: https://supabase.com/dashboard/project/tnkmrrfxzsrbfndpkonh
project_id = "tnkmrrfxzsrbfndpkonh"

[api]
enabled = true
port = 54321
# The schemas PostgREST exposes. `amryn` is deliberately absent: it holds the
# RLS helper functions, which are called by policies and must not be reachable
# from a client.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# A page of opportunities or metric values, not a table dump.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
# The worked demo organisation: twelve months of trading history, so a fresh
# local stack has something true to show.
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

# Catches outbound mail locally, so magic links can be tested without sending
# anything to a real address.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# ── auth ───────────────────────────────────────────────────────────────────

[auth]
enabled = true

# Where Supabase sends people after email confirmation and OAuth.
#
# CHANGE THESE TWO FOR PRODUCTION — set them to your deployment before running
# `supabase config push`, or the remote project will be pointed at localhost
# and every magic link will break.
#
# The callback path must match src/app/auth/callback/route.ts.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  # Add your deployment, e.g.:
  # "https://your-project.vercel.app/auth/callback",
  #
  # Vercel preview deployments get a new hostname per commit, so allow the
  # pattern rather than adding them one at a time:
  # "https://your-project-*.vercel.app/auth/callback",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Amryn has no anonymous surface — every route resolves a workspace, and RLS
# needs a real member to scope against.
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# On locally, off in production: a real deployment should confirm addresses
# before it will hand someone a session.
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sessions]
# An executive dashboard left open on an unlocked laptop is a real exposure.
# Twelve hours ends the session at roughly the end of a working day.
timebox = "12h"
inactivity_timeout = "8h"

# ── external providers ─────────────────────────────────────────────────────
# Both are wired in the sign-in page. Enable a provider here, supply its
# credentials as environment variables, and it starts working — the code needs
# no change. Secrets are read from the environment and never committed.

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.azure]
enabled = false
client_id = "env(SUPABASE_AUTH_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_AZURE_SECRET)"
url = "https://login.microsoftonline.com/common"
