# Action majors are pinned deliberately. GitHub forces actions targeting
# Node 20 onto Node 24 and warns; when Node 20 support is removed outright,
# a workflow left on the old majors stops running rather than warning.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The whole site — marketing pages and client platform alike — is
      # rendered to HTML here. There is no server in the deployment, so there
      # is nothing to configure and no secret to hold: `next build` with
      # `output: 'export'` produces `out/`, and `out/` is the site.
      - name: Build the static site
        run: npm run build

      # Pages serves this repository at /Amryn, and Jekyll would otherwise
      # discard Next's `_next/` directory for starting with an underscore.
      - name: Stop Jekyll from processing the output
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
