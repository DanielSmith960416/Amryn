# Action majors are pinned deliberately. GitHub forces actions targeting
# Node 20 onto Node 24 and warns; when Node 20 support is removed outright,
# a workflow left on the old majors stops running rather than warning.
name: Deploy /docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the /docs folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
