# Action majors are pinned deliberately. GitHub forces actions targeting
# Node 20 onto Node 24 and warns; when Node 20 support is removed outright,
# a workflow left on the old majors stops running rather than warning.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      # setup.sql and src/lib/db/setup-sql.ts are generated from the
      # migrations, and a generated file committed to the repository is a file
      # that can be stale. Both are rebuilt and the tree compared, so a
      # migration added without regenerating fails here rather than on
      # somebody's database. This job has Node; the database job does not.
      - name: Confirm the generated setup files are current
        run: |
          node scripts/build-setup-sql.mjs
          git diff --exit-code -- supabase/setup.sql src/lib/db/setup-sql.ts

      # No database, no mail service, no API keys — which is the point. A
      # deployment gets a URL before anybody has configured anything, and the
      # sign-in page explains what is still missing rather than erroring. If
      # the build starts needing a secret to compile, that promise is broken
      # and this is where it should be caught.
      - name: Build
        run: npm run build

      # The worker is a second program from the same source, and it is built
      # here for the same reason the image is: so that a handler that stops
      # compiling, or one that reaches for `server-only` and could never run
      # outside a request, fails in a pull request rather than at three in the
      # morning on a queue nobody is watching.
      - name: Build the worker
        run: npm run build:worker

      # Building the worker proves it compiles; it does not prove it starts.
      # A package left external is one esbuild deliberately does not bundle,
      # and whether it resolves is decided on the machine that runs the file.
      # nodemailer was marked external on the reasoning that Next's tracing
      # would place it in .next/standalone the way it does for pg. It had not,
      # and the worker crashlooped on its first boot after deploy — the whole
      # queue down, not just the mail. This is that failure, moved into a pull
      # request.
      # Two checks, because they catch different failures and each is blind to
      # the other's. One reads the tree the image ships and asks whether every
      # external is in it. The other starts the built worker the way the
      # container does and asks whether it gets as far as its own
      # configuration. The worker was taken down twice in one evening — once by
      # each — with a green build both times.
      - name: Confirm the worker can actually start
        run: npm run check:worker

      # Anything in .next/static or a prerendered document is served to every
      # visitor. The service role key bypasses every row level security policy
      # in the database, and it is a JWT signed with the same secret as the
      # anon key that legitimately ships in the bundle — so the check that
      # matters reads the claim rather than the shape. See the script's header
      # for what each check is worth and what was measured to find out.
      - name: Confirm no secret reached the browser bundle
        run: npm run check:secrets

      # The build above runs with no NEXT_PUBLIC_* set, exactly as the
      # Dockerfile permits. That is what makes this check meaningful: a page
      # prerendered under those conditions writes no settings into the
      # document and ships with the build's inlined `undefined` behind it,
      # which surfaces only on somebody's deployment, as an invalid-key
      # message naming a setting that is plainly present in the dashboard.
      - name: Confirm the auth pages read settings at run time
        run: npm run check:runtime

      # check:site drives a real browser, because the behaviour it checks is
      # browser behaviour: the platform links reveal themselves from script
      # once APP_URL is set. The script prefers a Chromium already on the
      # machine and falls back to Playwright's own — a runner has neither, so
      # it has to be fetched. Chromium alone, not all three engines.
      - name: Install a browser for the marketing-site check
        run: npx playwright install --with-deps chromium

      # The marketing site has no build step and no other tests, and it is the
      # front door to sign-in. Its one piece of behaviour is exactly the kind
      # of thing that breaks silently.
      - name: Check the marketing site
        run: npm run check:site

  # ── the half that never ran in CI ────────────────────────────────────────
  #
  # 187 assertions about row level security, tenancy, the two-factor guard and
  # the subscription trigger ran only on whichever machine last thought to run
  # them. They are the assertions that matter most — every guarantee this
  # product makes about one company not seeing another's data is made by a
  # policy, and a policy is not exercised by a typecheck.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the suite starts against a container that has accepted
        # the port but not yet finished initialising, and fails in a way that
        # looks like a schema error.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # run.sh builds the database from nothing, applies every migration in
      # filename order, then runs the suite — the same script a developer runs,
      # so the two cannot drift.
      - name: Apply the migrations and run the schema tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: amryn_ci
        run: bash supabase/tests/run.sh

      # The other way into a database, and the one nothing exercised.
      #
      # run.sh above applies the migrations one file at a time. setup.sql is
      # the same schema as a single transaction, and it is what /setup runs and
      # what DEPLOYMENT.md says to paste into the SQL editor. The two are meant
      # to be equivalent and nothing checked that they were, so setup.sql spent
      # two migrations closing with `expected 49 tables` against a schema that
      # had grown to 56 — the assertion raised, the transaction rolled back,
      # and every fresh install by that route left an empty database.
      #
      # A fresh database rather than the one above, because setup.sql is only
      # ever correct against nothing: it says so itself, and running it twice
      # fails on the first `create table`.
      - name: Confirm setup.sql builds the same schema in one transaction
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -q -c 'create database amryn_setup;'
          psql -v ON_ERROR_STOP=1 -d amryn_setup -q -f supabase/tests/00_supabase_shim.sql
          psql -v ON_ERROR_STOP=1 -d amryn_setup -q -f supabase/setup.sql

      # The last untested link in the backup chain.
      #
      # A dump has been taken nightly since #89, verified for its completion
      # marker, checksummed, counted and recorded where /diagnostics reads its
      # age. All of which proves a file exists and is intact. None of it proves
      # the file can become a database again — which is the only property
      # anybody wants from a backup, and the one nobody had ever tested.
      #
      # Rows are inserted first on purpose. The schema suite leaves the
      # database empty, and restoring an empty database into an empty database
      # proves nothing at all: the check would pass for ever while the backup
      # path quietly rotted.
      #
      # No customer data is involved. CI dumps the schema it just built, with
      # two rows it wrote itself, and restores that.
      - name: Prove a backup can actually be restored
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/amryn_ci
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 -d amryn_ci -q -c "
            insert into public.organisations (id, name, slug, industry, country_code, currency_code)
            values
              ('11111111-1111-4111-8111-111111111111','Restore Check','restore-check','retail','ZA','ZAR'),
              ('22222222-2222-4222-8222-222222222222','Second Org','second-org','manufacturing','ZA','ZAR')
            on conflict do nothing;"

          node scripts/backup.mjs --out "$RUNNER_TEMP/backups"
          MANIFEST="$(ls "$RUNNER_TEMP"/backups/*.manifest.json | head -1)"

          # Restores into a scratch database of its own, compares every row
          # count against the manifest, and exits non-zero on any difference.
          node scripts/restore-check.mjs --manifest "$MANIFEST"
